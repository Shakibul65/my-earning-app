<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EarnClick{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="brand-logo">Earn<span>Click</span></a>
            <div class="nav-links">
                {% if session.user_id %}
                    <a href="/dashboard" class="nav-link">ড্যাশবোর্ড</a>
                    <a href="/withdraw" class="nav-link">উত্তোলন</a>
                    <a href="/logout" class="btn-logout">লগআউট</a>
                {% else %}
                    <a href="/login" class="nav-link">লগইন</a>
                    <a href="/register" class="btn-primary">রেজিস্টার</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 EarnClick. সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>
</body>
</html>
