{% extends 'base.html' %}

{% block title %}লগইন - EarnClick{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="form-card">
        <h2 class="form-title">লগইন করুন</h2>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">ইমেইল ঠিকানা</label>
                <input type="email" id="email" name="email" placeholder="আপনার ইমেইল দিন" required>
            </div>
            <div class="form-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" name="password" placeholder="আপনার পাসওয়ার্ড দিন" required>
            </div>
            <button type="submit" class="btn-submit">লগইন করুন</button>
        </form>
        <p class="auth-footer">
            নতুন ইউজার? <a href="/register">রেজিস্টার করুন</a>
        </p>
    </div>
</div>
{% endblock %}
