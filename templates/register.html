{% extends 'base.html' %}
{% block title %}রেজিস্টার - EarnClick{% endblock %}
{% block content %}
<div class="form-card">
    <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>
    <form method="POST">
        <label>ইউজারনেম</label>
        <input type="text" name="username" required>

        <label>ইমেইল</label>
        <input type="email" name="email" required>

        <label>পাসওয়ার্ড</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn btn-primary btn-full">রেজিস্টার করুন</button>
    </form>
    <p class="form-footer">আগে থেকেই অ্যাকাউন্ট আছে? <a href="{{ url_for('login') }}">লগইন করুন</a></p>
</div>
{% endblock %}
