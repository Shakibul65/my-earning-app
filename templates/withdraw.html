{% extends 'base.html' %}

{% block title %}টাকা তুলুন - EarnClick{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="form-card">
        <h2 class="form-title">টাকা উত্তোলন (Withdraw)</h2>
        <p class="text-center" style="margin-bottom: 1rem; color: var(--text-muted);">
            বর্তমান ব্যালেন্স: <strong>৳{{ "%.2f"|format(user.balance) }}</strong>
        </p>

        <form method="POST">
            <div class="form-group">
                <label for="method">পেমেন্ট মেথড সিলেক্ট করুন</label>
                <select name="method" id="method" required class="form-input">
                    <option value="bKash">বিকাশ (bKash)</option>
                    <option value="Nagad">নগদ (Nagad)</option>
                    <option value="Rocket">রকেট (Rocket)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="account_number">মোবাইল নম্বর (Personal)</label>
                <input type="text" name="account_number" id="account_number" placeholder="01700000000" required>
            </div>

            <div class="form-group">
                <label for="amount">পরিমাণ (সর্বনিম্ন ৳৫০)</label>
                <input type="number" step="1" min="50" name="amount" id="amount" placeholder="50" required>
            </div>

            <button type="submit" class="btn-submit">উত্তোলন করার অনুরোধ পাঠান</button>
        </form>
    </div>
</div>
{% endblock %}
